name: Receiving Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set environment variables
        run: |
          echo "JWT_SECRET=vZWtIb0AUbrMiSNB1tL+EzavlbQ9gpEgQpYxlLs1FuA" >> $GITHUB_ENV
          echo "JWT_EXPIRATION=43200000" >> $GITHUB_ENV
          echo "POSTGRES_VERSION=16-alpine" >> $GITHUB_ENV
          echo "DB_NAME=mydatabase" >> $GITHUB_ENV
          echo "DB_USER=myuser" >> $GITHUB_ENV
          echo "DB_PASSWORD=secret" >> $GITHUB_ENV
          echo "KAFKA_VERSION=4.3.1" >> $GITHUB_ENV
          echo "ZOOKEEPER_VERSION=3.9.3" >> $GITHUB_ENV
          echo "KAFKA_BOOTSTRAP_SERVERS=kafka:9092" >> $GITHUB_ENV
          echo "REDIS_VERSION=7.4-alpine" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=secret" >> $GITHUB_ENV
          echo "SPRING_PROFILES_ACTIVE=dev" >> $GITHUB_ENV

      - name: Unit tests
        run: mvn test

      - name: Integration tests
        run: mvn verify -P integration-tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/