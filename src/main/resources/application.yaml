spring:
  application:
    name: receiving-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  threads:
    virtual:
      enabled: true

  data:
    web:
      pageable:
        max-page-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history


  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.web: DEBUG